services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inbox_mychef
    ports:
      - "5433:5432"
    volumes:
      - inbox_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inbox_mychef"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  inbox_pg:
